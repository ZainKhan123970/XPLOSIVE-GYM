    // Canvas Poster Generator
    const generateGymPosterImage = (mainTitle, subTitle, descText) => {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');

      const bgGrad = ctx.createLinearGradient(0, 0, 800, 1000);
      bgGrad.addColorStop(0, '#121216');
      bgGrad.addColorStop(0.5, '#09090c');
      bgGrad.addColorStop(1, '#040405');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 800, 1000);

      ctx.fillStyle = '#e9222a';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(340, 0);
      ctx.lineTo(0, 170);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 64px Kanit, sans-serif';
      ctx.textAlign = 'left';
      
      const words = mainTitle.toUpperCase().split(' ');
      let yPos = 190;
      words.forEach((word) => {
        if (["AREA", "ZONE", "STATION", "CHALLENGE", "TRAINING", "GUARD", "ROOM", "FACILITIES", "SURVEILLANCE", "GENERATOR", "PARKING", "CONDITIONER"].includes(word)) {
          ctx.fillStyle = '#e9222a';
        } else {
          ctx.fillStyle = '#ffffff';
        }
        ctx.fillText(word, 50, yPos);
        yPos += 68;
      });

      ctx.fillStyle = '#e9222a';
      ctx.fillRect(50, yPos, 200, 4);
      yPos += 35;

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 22px Kanit, sans-serif';
      ctx.fillText(subTitle.toUpperCase(), 50, yPos);
      yPos += 45;

      ctx.fillStyle = '#d1d5db';
      ctx.font = '400 17px Kanit, sans-serif';
      const maxWidth = 350;
      const lineHeight = 25;
      const descWords = descText.split(' ');
      let line = '';

      for (let n = 0; n < descWords.length; n++) {
        let testLine = line + descWords[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, 50, yPos);
          line = descWords[n] + ' ';
          yPos += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 50, yPos);

      ctx.fillStyle = '#e9222a';
      ctx.font = '900 28px Kanit, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('XPLOSIVE', 750, 60);
      ctx.fillStyle = '#23abe3';
      ctx.font = '700 20px Kanit, sans-serif';
      ctx.fillText('FITNESS', 750, 85);

      ctx.fillStyle = '#e9222a';
      ctx.fillRect(0, 920, 800, 80);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 18px Kanit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SECTOR V, GULSHAN-E-MAYMAR | CALL/WHATSAPP: 0316 2603591', 400, 968);

      return canvas.toDataURL('image/jpeg', 0.9);

        label: "SECURITY GUARD",

        )

        subtitle: "CLEAN SPACE. MODERN COMFORT.",
        image: generateGymPosterImage("Washroom Facilities", "CLEAN SPACE. MODERN COMFORT.", "Enjoy a clean, modern, and comfortable environment designed to complement your fitness journey."),

    const AUTO_PLAY_INTERVAL = 3000;
    const ITEM_HEIGHT = 65;

    const wrap = (min, max, v) => {
      const rangeSize = max - min;
      return ((((v - min) % rangeSize) + rangeSize) % rangeSize) + min;
    };

    function FeatureCarousel() {
      const [step, setStep] = useState(0);
      const [isPaused, setIsPaused] = useState(false);
      const [hoveredIndex, setHoveredIndex] = useState(null);
      const [isExpanded, setIsExpanded] = useState(false);
      
      const hoverTimerRef = useRef(null);
      const currentIndex = ((step % FEATURES.length) + FEATURES.length) % FEATURES.length;

      const nextStep = useCallback(() => {
        if (!isPaused && !isExpanded) {
          setStep((prev) => prev + 1);
        }
      }, [isPaused, isExpanded]);

      const handleChipClick = (index) => {
        const diff = (index - currentIndex + FEATURES.length) % FEATURES.length;
        if (diff > 0) setStep((s) => s + diff);
      };

      const handleMouseEnter = (index) => {
        setIsPaused(true);
        if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
        hoverTimerRef.current = setTimeout(() => {
          setHoveredIndex(index);
        }, 100);
      };

      const handleMouseLeave = () => {
        setIsPaused(false);
        if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
        setHoveredIndex(null);
      };

      useEffect(() => {
        if (isPaused || isExpanded) return;
        const interval = setInterval(nextStep, AUTO_PLAY_INTERVAL);
        return () => clearInterval(interval);
      }, [nextStep, isPaused, isExpanded]);

      const getCardStatus = (index) => {
        const diff = index - currentIndex;
        const len = FEATURES.length;

        let normalizedDiff = diff;
        if (diff > len / 2) normalizedDiff -= len;
        if (diff < -len / 2) normalizedDiff += len;

        if (normalizedDiff === 0) return "active";
        if (normalizedDiff === -1) return "prev";
        if (normalizedDiff === 1) return "next";
        return "hidden";
      };

      return (
        <div className="w-full max-w-7xl mx-auto my-6 relative z-10">
          
          <div className={`relative overflow-hidden rounded-[2.5rem] lg:rounded-[3.5rem] flex flex-col lg:flex-row min-h-[600px] lg:aspect-video border border-white/10 bg-[#101010] shadow-2xl transition-all duration-500 ${isExpanded ? 'filter blur-md scale-[0.98] pointer-events-none' : ''}`}>
            
            {/* Left Column Vertical Menu - Original Blue Theme (#62B2FE) */}
            <div className="w-full lg:w-[40%] min-h-[350px] md:min-h-[450px] lg:h-full relative z-30 flex flex-col items-start justify-center overflow-hidden px-6 md:px-12 lg:pl-12 bg-[#62B2FE]">
              <div className="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-[#62B2FE] via-[#62B2FE]/80 to-transparent z-40 pointer-events-none" />
              <div className="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-[#62B2FE] via-[#62B2FE]/80 to-transparent z-40 pointer-events-none" />
              
              <div className="relative w-full h-full flex items-center justify-center lg:justify-start z-20">
                {FEATURES.map((feature, index) => {
                  const isActive = index === currentIndex;
                  const isHovered = index === hoveredIndex;
                  const distance = index - currentIndex;
                  const wrappedDistance = wrap(
                    -(FEATURES.length / 2),
                    FEATURES.length / 2,
                    distance
                  );

                  return (
                    <motion.div
                      key={feature.id}
                      style={{
                        height: ITEM_HEIGHT,
                        width: "fit-content",
                      }}
                      animate={{
                        y: wrappedDistance * ITEM_HEIGHT,
                        opacity: 1 - Math.abs(wrappedDistance) * 0.25,
                      }}
                      transition={{
                        type: "spring",
                        stiffness: 90,
                        damping: 22,
                        mass: 1,
                      }}
                      className="absolute flex items-center justify-start"
                    >
                      <button
                        onClick={() => handleChipClick(index)}
                        onMouseEnter={() => handleMouseEnter(index)}
                        onMouseLeave={handleMouseLeave}
                        className={`relative flex items-center gap-4 px-6 md:px-8 py-3.5 rounded-full transition-all duration-300 text-left group border ${
                          isActive
                            ? "bg-white text-[#62B2FE] border-white z-10 shadow-xl scale-105"
                            : isHovered
                            ? "bg-white/20 text-white border-white/50 scale-102"
                            : "bg-transparent text-white/60 border-white/20 hover:border-white/40 hover:text-white"
                        }`}
                      >
                        <div className={`flex items-center justify-center transition-colors ${isActive ? 'text-[#62B2FE]' : 'text-white'}`}>
                          {feature.icon}
                        </div>
                        <span className="font-semibold text-xs md:text-sm tracking-tight whitespace-nowrap uppercase">
                          {feature.label}
                        </span>
                      </button>
                    </motion.div>
                  );
                })}
              </div>
            </div>

            {/* Right Card Display Stack */}
            <div className="flex-1 min-h-[500px] md:min-h-[600px] lg:h-full relative bg-secondary/30 flex items-center justify-center py-12 px-6 md:px-12 overflow-hidden border-t lg:border-t-0 lg:border-l border-white/10">
              <div className="relative w-full max-w-[420px] aspect-[4/5] flex items-center justify-center">
                {FEATURES.map((feature, index) => {
                  const status = getCardStatus(index);
                  const isActive = status === "active";
                  const isPrev = status === "prev";
                  const isNext = status === "next";
                  const isHovered = hoveredIndex === index;

                  return (
                    <motion.div
                      key={feature.id}
                      initial={false}
                      animate={{
                        x: isActive ? 0 : isPrev ? -100 : isNext ? 100 : 0,
                        scale: isActive ? (isHovered ? 1.03 : 1) : isPrev || isNext ? 0.85 : 0.7,
                        opacity: isActive ? 1 : isPrev || isNext ? 0.4 : 0,
                        rotate: isPrev ? -3 : isNext ? 3 : 0,
                        zIndex: isActive ? 20 : isPrev || isNext ? 10 : 0,
                        pointerEvents: isActive ? "auto" : "none",
                      }}
                      transition={{
                        type: "spring",
                        stiffness: 260,
                        damping: 25,
                        mass: 0.8,
                      }}
                      onClick={() => isActive && setIsExpanded(true)}
                      onMouseEnter={() => handleMouseEnter(index)}
                      onMouseLeave={handleMouseLeave}
                      className="absolute inset-0 rounded-[2rem] md:rounded-[2.8rem] overflow-hidden border-4 md:border-8 border-[#121212] bg-[#121212] origin-center cursor-pointer shadow-2xl group"
                    >
                      <img
                        src={feature.image}
                        alt={feature.label}
                        className={`w-full h-full object-cover transition-all duration-500 ${
                          isActive
                            ? isHovered ? "grayscale-0 scale-105" : "grayscale-0"
                            : "grayscale blur-[2px] brightness-75"
                        }`}
                      />

                      <AnimatePresence>
                        {isActive && (
                          <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            exit={{ opacity: 0, y: 10 }}
                            className="absolute inset-x-0 bottom-0 p-8 pt-24 bg-gradient-to-t from-black/95 via-black/50 to-transparent flex flex-col justify-end pointer-events-none"
                          >
                            <div className="bg-[#e9222a] text-white px-3.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest w-fit shadow-lg mb-2">
                              {index + 1} • {feature.label}
                            </div>
                            <h3 className="text-white font-bold text-lg md:text-xl leading-tight drop-shadow-md tracking-tight mb-2">
                              {feature.subtitle}
                            </h3>
                            <p className="text-white/80 font-light text-xs md:text-sm line-clamp-3 leading-relaxed">
                              {feature.description}
                            </p>
                            <div className="mt-3 flex items-center gap-2 text-[#23abe3] text-xs font-semibold uppercase tracking-wider">
                              <span>Click to Expand</span>
                              <span>→</span>
                            </div>
                          </motion.div>
                        )}
                      </AnimatePresence>

                      <div className={`absolute top-6 left-6 flex items-center gap-2.5 transition-opacity duration-300 bg-black/60 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/10 ${isActive ? 'opacity-100' : 'opacity-0'}`}>
                        <div className="w-2 h-2 rounded-full bg-[#e9222a] shadow-[0_0_8px_#e9222a]" />
                        <span className="text-white/90 text-[10px] font-semibold uppercase tracking-widest">
                          XPLOSIVE FITNESS
                        </span>
                      </div>
                    </motion.div>
                  );
                })}
              </div>
            </div>

          </div>

          {/* Full Screen Frozen Modal Effect */}
          <AnimatePresence>
            {isExpanded && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8 bg-black/80 backdrop-blur-xl"
                onClick={() => setIsExpanded(false)}
              >
                <motion.div
                  initial={{ scale: 0.85, y: 20 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.85, y: 20 }}
                  transition={{ type: "spring", damping: 25, stiffness: 300 }}
                  className="relative w-full max-w-4xl bg-[#101010] border border-white/20 rounded-[2.5rem] overflow-hidden shadow-2xl flex flex-col md:flex-row max-h-[90vh]"
                  onClick={(e) => e.stopPropagation()}
                >
                  <button
                    onClick={() => setIsExpanded(false)}
                    className="absolute top-4 right-4 z-30 w-10 h-10 rounded-full bg-black/70 border border-white/20 text-white flex items-center justify-center text-xl hover:bg-[#e9222a] transition-colors"
                  >
                    ✕
                  </button>

                  <div className="w-full md:w-1/2 h-64 md:h-auto relative bg-black">
                    <img
                      src={FEATURES[currentIndex].image}
                      alt={FEATURES[currentIndex].label}
                      className="w-full h-full object-cover"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-r from-[#101010] via-transparent to-transparent" />
                  </div>

                  <div className="w-full md:w-1/2 p-8 md:p-10 flex flex-col justify-center bg-[#101010]">
                    <div className="flex items-center gap-2 mb-3 text-[#23abe3]">
                      {FEATURES[currentIndex].icon}
                      <span className="font-bold text-xs tracking-widest uppercase">Service Details</span>
                    </div>

                    <h2 className="text-3xl font-extrabold text-white uppercase tracking-tight mb-2">
                      {FEATURES[currentIndex].label}
                    </h2>

                    <p className="text-[#e9222a] font-bold text-sm uppercase tracking-wide mb-4">
                      {FEATURES[currentIndex].subtitle}
                    </p>

                    <p className="text-gray-300 text-sm leading-relaxed mb-6 font-light">
                      {FEATURES[currentIndex].description}
                    </p>

                    <a
                      href="https://wa.me/923162603591?text=Hi%20Xplosive%20Fitness%2C%20I%27d%20like%20to%20know%20more%20about%20your%20services."
                      target="_blank"
                      rel="noreferrer"
                      className="cta-btn justify-center text-center w-full"
                    >
                      Ask about a service
                    </a>
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>

        </div>
      );
    }

          </section>

          <FeatureCarousel />

          {/* Bottom CTA Button */}
          <div className="relative z-10 flex justify-center mt-8 mb-12">
            <a

            >
